name: CI

on:
  push:
  pull_request:

jobs:
  # Lists the files that `core/tools/format.sh` would change. The clang-format of Ubuntu 24.04 is
  # version 18, the one the code is formatted with; another version can format differently.
  format:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check the formatting
        working-directory: core
        run: tools/format.sh --check

  build-and-test:
    # GCC 13 (the debug build, and the C++20 library of both builds) and clang 18 with lld (the
    # release build, core/cmake/clang.cmake).
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # The version of the build comes from `git describe`.
          fetch-depth: 0

      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-13 clang-18 lld-18

      # Configures, builds and runs the tests of both the debug and the release build.
      - name: Build and test
        working-directory: core
        run: ./build.sh

  # The address, leak and undefined behavior sanitizers. A report fails the test. Run
  # `./build.sh ubsan` for the undefined behavior sanitizer alone, which is much faster.
  sanitizers:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # The address sanitizer of GCC 13 crashes at startup with the address randomization of the
      # kernel of the runners (vm.mmap_rnd_bits=32), a lower value is what it is built for.
      - name: Lower the address randomization
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build and test with sanitizers
        working-directory: core
        run: ./build.sh asan
