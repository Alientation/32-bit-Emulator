name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # GCC 13 for <format> and the C++20 library.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The version of the build comes from `git describe`.
          fetch-depth: 0

      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Configures, builds and runs the tests of both the debug and the release build.
      - name: Build and test
        working-directory: core
        run: ./build.sh
